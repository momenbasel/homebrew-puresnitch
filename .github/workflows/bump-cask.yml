name: Bump cask

# The cask went stale at v0.1.0 while upstream shipped v0.2.0
# (momenbasel/puresnitch#4), so `brew install` handed out a build that predated
# every fix. This job re-checks upstream on a schedule and bumps itself, which
# means the tap self-heals even when a release is cut by hand.
#
# Runs on macOS and audits before pushing, because a push authored by
# GITHUB_TOKEN does not trigger workflow runs: audit.yml would never see an
# automated bump, so the gate has to live inside this job.

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [puresnitch-release]

permissions:
  contents: write

concurrency:
  group: bump-cask
  cancel-in-progress: false

jobs:
  bump:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compare the cask against the latest upstream release
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          CURRENT=$(sed -n 's/^  version "\(.*\)"$/\1/p' Casks/puresnitch.rb)
          TAG=$(gh release view --repo momenbasel/puresnitch --json tagName --jq .tagName)
          LATEST="${TAG#v}"

          # `case` patterns are globs, not regexes: `v[0-9]*.[0-9]*.[0-9]*`
          # happily matches v0.3.0-beta.1 and v1.2.3rc4. Those would clear this
          # check, download a DMG, and only then die on the stricter numeric
          # guard in the rewrite step — an error three steps from its cause.
          # Reject anything the rewrite step would reject, here.
          case "$TAG" in
            v[0-9]*.[0-9]*) ;;
            *) echo "::error::refusing to act on an unexpected upstream tag: $TAG"; exit 1 ;;
          esac
          if [ -n "$(printf '%s' "$LATEST" | tr -d '0-9.')" ]; then
            echo "::error::upstream tag $TAG is not a plain numeric version; a human should decide what to do with it"
            exit 1
          fi

          if [ "$CURRENT" = "$LATEST" ]; then
            CHANGED=false
            echo "Cask is already on $CURRENT."
          elif [ "$(printf '%s\n%s\n' "$CURRENT" "$LATEST" | sort -V | tail -1)" != "$LATEST" ]; then
            # `=` alone is not an ordering check. Mark the newest release as a
            # prerelease, or delete it, and `releases/latest` starts returning
            # an older tag whose DMG and checksum are perfectly self-consistent,
            # so the audit gate passes and this job pushes a downgrade. Users
            # then `brew upgrade` onto a build with known bugs: issue #4 again,
            # pointed the other way. Yanking a release is abnormal and a person
            # should decide, so fail loudly rather than no-op quietly.
            echo "::error::upstream latest ($LATEST) is older than the cask ($CURRENT); refusing to downgrade. If a release was yanked, edit Casks/puresnitch.rb by hand."
            exit 1
          else
            CHANGED=true
            echo "::notice::Bumping $CURRENT -> $LATEST"
          fi
          {
            echo "current=$CURRENT"
            echo "latest=$LATEST"
            echo "tag=$TAG"
            echo "changed=$CHANGED"
          } >> "$GITHUB_OUTPUT"

      - name: Download the release DMG and compute its checksum
        if: steps.check.outputs.changed == 'true'
        id: dmg
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.check.outputs.tag }}
          LATEST: ${{ steps.check.outputs.latest }}
        run: |
          set -euo pipefail
          ASSET="PureSnitch-${LATEST}.dmg"
          # The checksum is always recomputed from the published asset. A
          # repository_dispatch payload is an untrusted hint about *which*
          # release to look at, never a source of truth for the hash.
          gh release download "$TAG" --repo momenbasel/puresnitch --pattern "$ASSET" --dir /tmp/dmg
          SHA=$(shasum -a 256 "/tmp/dmg/$ASSET" | cut -d' ' -f1)
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"
          echo "::notice::$ASSET sha256=$SHA"

      - name: Rewrite the cask
        if: steps.check.outputs.changed == 'true'
        env:
          LATEST: ${{ steps.check.outputs.latest }}
          SHA: ${{ steps.dmg.outputs.sha256 }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, pathlib, re

          version = os.environ["LATEST"]
          sha = os.environ["SHA"]
          if not re.fullmatch(r"[0-9]+(\.[0-9]+)*", version):
              raise SystemExit(f"refusing to write a non-numeric version: {version!r}")
          if not re.fullmatch(r"[0-9a-f]{64}", sha):
              raise SystemExit(f"refusing to write a malformed sha256: {sha!r}")

          path = pathlib.Path("Casks/puresnitch.rb")
          text = path.read_text()
          text, n_v = re.subn(r'^  version ".*"$', f'  version "{version}"', text, count=1, flags=re.M)
          text, n_s = re.subn(r'^  sha256 ".*"$', f'  sha256 "{sha}"', text, count=1, flags=re.M)
          if n_v != 1 or n_s != 1:
              raise SystemExit(f"cask rewrite failed (version={n_v}, sha256={n_s})")
          path.write_text(text)
          PY
          git diff -- Casks/puresnitch.rb

      - name: Audit the rewritten cask before pushing it
        if: steps.check.outputs.changed == 'true'
        env:
          # Without this, `brew audit --online` uses unauthenticated GitHub API
          # calls and dies on the 60/hour limit. A gate that fails for reasons
          # unrelated to the cask silently blocks every bump, which is the exact
          # failure this whole job exists to prevent.
          HOMEBREW_GITHUB_API_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAP_DIR="$(brew --repository)/Library/Taps/momenbasel/homebrew-puresnitch"
          rm -rf "$TAP_DIR"
          mkdir -p "$(dirname "$TAP_DIR")"
          cp -R "$GITHUB_WORKSPACE" "$TAP_DIR"
          brew trust --tap momenbasel/puresnitch

          # Style is scoped to the cask file on purpose. `brew style <tap>` also
          # runs actionlint and shellcheck over .github/workflows — that is how
          # the SC2129 in this very file was caught — but inside a pre-push gate
          # it means a lint nit in an unrelated workflow blocks every cask bump
          # while the cask itself is fine. Tap-wide style stays in audit.yml,
          # where blocking is the right response.
          #
          # `brew audit` checks two things a version+sha rewrite structurally
          # cannot satisfy: audit_min_os mounts the DMG and compares its
          # LSMinimumSystemVersion against `depends_on macos:`, and
          # audit_livecheck_version compares the written version against
          # livecheck. So the first release that raises the deployment target,
          # renames the app, or changes the asset name reds this job every six
          # hours until a person edits the cask. Right direction to fail in, but
          # the run has to say so plainly instead of looking like a flake.
          if ! { brew style "$TAP_DIR/Casks/puresnitch.rb" \
                 && brew audit --cask --online --strict momenbasel/puresnitch/puresnitch; }; then
            echo "::error::The rewritten cask does not pass audit, so nothing was pushed. This job only rewrites version and sha256. If upstream raised the minimum macOS version, update depends_on macos: in Casks/puresnitch.rb by hand; if it renamed the app or the DMG asset, those need editing too."
            exit 1
          fi
          brew info --cask momenbasel/puresnitch/puresnitch

      - name: Commit and push
        if: steps.check.outputs.changed == 'true'
        env:
          CURRENT: ${{ steps.check.outputs.current }}
          LATEST: ${{ steps.check.outputs.latest }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/puresnitch.rb
          git commit -m "puresnitch ${LATEST}" -m "Automated bump from ${CURRENT}. Audited before push."
          git push
